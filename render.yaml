services:
  - type: web
    name: auth-proxy
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: auth-proxy-db
          property: connectionString

databases:
  - name: auth-proxy-db
    plan: free
